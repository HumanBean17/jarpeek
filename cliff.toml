# git-cliff configuration — conventional-commit release notes for GitHub Releases.
# Used by .github/workflows/release.yml (`git-cliff --latest`).
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_prototypes = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^spec", skip = true }, # working drafts, not product changes
  { message = "^\\d+\\.\\d+\\.\\d+$", skip = true }, # `npm version` bump commits
  { message = "^chore", group = "Miscellaneous" },
  { message = ".*", group = "Other" },
]
